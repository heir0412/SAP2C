# ===========================================
# Cinemagraph 全流程统一配置
# ===========================================

# ========== 样本输入 ==========
samples:
  root_dir: "./sam"
  sample_name: "00007"
  input_image: "./sam/00007/00007.jpg"

# ========== 模块路径 ==========
paths:
  realistic_generation: "model/realistic_generation/generation.py"
  lisa_segmentation: "model/LISA/chat.py"
  dinov3_segmentation: "model/dinov3/inference.py"
  motion_generation: "./"
  video_generation: "./video_inference.py"
  # DINOv3 模型文件
  ckpt: "./model/dinov3/runs/dinov3_l_512/ckpts/best_ep018_dice0.7799.pth"
  dino_ckpt: "./model/dinov3/web_pth/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
  repo_dir: "./model/dinov3/dinov3"
  tokenizer_path: "./openai/clip-vit-large-patch14"

# ========== Realistic Generation ==========
realistic_generation:
  vision_language_model: "qwen-vl-max"
  image_edit_model: "qwen-image-edit-plus"
  lexicon_path: "model/realistic_generation/artistic_lexicon.json"
  fixed_suffix: "realistic photograph"

# ========== LISA Segmentation ==========
lisa:
  version: "./model/LISA/LISA-13B-v1"
  precision: "bf16"
  focus_text: "Segment all water regions in the image, including rivers, oceans, and lakes."
  vis_save_path: "./samples/00001/"

# ========== DINOv3 分割参数 ==========
dinov3:
  backbone: "l"
  input_size: [512, 512]
  dice_thr: 0.5

# ========== 掩码融合参数 ==========
mask_fusion:
  mlp_ckpt: "./model/mask_fusion/runs/bce_dice/best_mlp_fusion.pth"
  threshold: 0.5
  feature_channels: 256
  hidden_channels: [256, 128, 64]
  lambda_bce: 1.0
  lambda_dice: 1.0

# ========== Motion 光流生成 ==========
optical_flow:
  model_name: "motion-pretrained"
  input_nc: 4
  output_nc: 2
  fineSize: 512
  use_prompts: True
  no_instance: True
  label_nc: 0
  batchSize: 1
  netG: spadexattnunetsd
  norm: "instance"

# ========== Video 视频生成 ==========
video:
  model_name: "video-pretrained"
  input_nc: 8
  output_nc: 3
  n_frames: 60
  speed: 0.5
  fineSize: 512
